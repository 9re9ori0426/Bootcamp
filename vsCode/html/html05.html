<!DOCTYPE html>
<html lang='en'>
<head>

    <title>Document</title>

        }

</head>

            <td rowspan="2">1</td>
            <td>2</td>
        </tr>

        </tr>
        <tr>
            <td>부대찌개</td>
            <td>혜화</td>
        </tr>
    </table>

    <table border="1" width="300px" height="300">
        <tr>
            <td colspan="2">1</td>
            <td rowspan="2">2</td>
        </tr>
        <tr>
            <td>3</td>

        </tr>
    </table>

</html>
