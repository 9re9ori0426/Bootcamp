<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: blanchedalmond;
            height: 200vh;
        }

        .menu {
            background-color: black;
            color: white;
            height: 50px;
            text-align: center;
            font-size: 25px;
        }

        .item {
            background-color: tomato;
            border: 1px solid;
            height: 200px;
            width: 200px;
            font-size: 70px;
            text-align: center;
        }

        .a {
            border: 1px solid blue;
            display: flex;
        }

        .card {
            background-color: blueviolet;
            transition: all 0.5s ease-in-out;
        }

        .card:hover {
            cursor: pointer;
            opacity: 0.5;
            transform: rotateY(180deg);
        }

        .b {
            border: 3px dotted violet;
            height: 700px;
            width: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .c {
            border: 1px solid black;
            height: 500px;
            width: 500px;
            display: flex;

            animation-name: rotate;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0);
            }

            100% {
                transform: rotate(180deg);
            }
        }

        .stone {
            background-color: aqua;
            position: absolute;
            top: 0px;
            left: 0px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="menu">nav</div>
        <div class="a">
            <div class="item">A</div>
            <div class="item">B</div>
        </div>
        <div class="a">
            <div class="item">A</div>
            <div class="item">B</div>
        </div>
        <div class="a">
            <div class="item">C</div>
            <div class="item card">D</div>
        </div>
        <div class="b">
            <div class="c" style="position: absolute;">
                <div class="item stone">1</div>
                <div class="item stone" style="top: 100px;  left: 100px;">2</div>
                <div class="item stone" style="top: 200px; left: 200px;">3</div>
                <div class="item stone" style="top: 300px; left: 300px;">4</div>
            </div>
        </div>
    </div>
</body>

</html>
