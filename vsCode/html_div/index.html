<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 2px solid;
            border-radius: 5px;
            padding: 5px;
        }
        .container {
            background-color: yellow;
            display: flex;
            width: 200px;
        }
        .item {
            background-color: green;
        }
        .item:nth-child(1) {
            z-index: 3;
        }
        .item:nth-child(2) {
            width: 300px;
            transform: scale(1.5);
            z-index: 1;
        }
        .item:nth-child(3) {

        }
        label:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
	<div class="item">AAAAAAAAA</div>
	<div class="item">BBBBBBB</div>
	<div class="item">CCCCC</div>
</div>

<label id="v1"><input type="radio" name="val"> block</label>
<label id="v2"><input type="radio" name="val"> flex</label>
<script>
    const container = document.querySelector(".container")
    document.querySelector("#v1").addEventListener("click", () => {
        container.style.flexDirection = 'column'
    })
    document.querySelector("#v2").addEventListener("click", () => {
        container.style.flexDirection = 'row'
    })
</script>
</body>
</html>
