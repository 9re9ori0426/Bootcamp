<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            border: 1px solid black;
            background-color: blanchedalmond;
            height: calc(200vh);
        }

        .menu {
            position: sticky;
            top: 0;
            background-color: black;
            color: white;
            height: 50px;
            text-align: center;
            font-size: 24pt;
        }

        .flex-box {
            display: flex;
            border: 2px solid blue;
        }

        .box {
            font-size: 50pt;
            border: 1px solid black;
            width: 200px;
            height: 200px;
            background-color: tomato;
            text-align: center;
        }

        @keyframes test {
            from {
                /* transform: scaleX(1); */
                transform: rotate(0deg);
            }

            to {
                /* transform: scaleX(-1); */
                transform: rotate(360deg);
            }
        }

        .card {
            &:hover {
                opacity: 0.5;
                cursor: pointer;
                animation-name: test;
                animation-duration: 15s;
                animation-fill-mode: forwards;
                animation-iteration-count: infinite;
                /* animation-direction: alternate; */
            }
        }

        .centered-box {
            border: 4px dotted red;
            width: 700px;
            height: 700px;
            align-items: center;
            justify-content: center;
        }

        .flex-inner-box {
            position: relative;
            border: 1px solid;
            width: 500px;
            height: 500px;

            :nth-child(2) {
                top: 100px;
                left: 100px
            }

            :nth-child(3) {
                top: 200px;
                left: 200px
            }

            :nth-child(4) {
                top: 300px;
                left: 300px
            }
        }

        .color-aqua {
            position: absolute;
            background-color: rgb(53, 216, 216);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="menu">nav</div>

        <div class="flex-box">
            <div class="box">A</div>
            <div class="box">B</div>
        </div>
        <div class="flex-box">
            <div class="box">A</div>
            <div class="box">B</div>
        </div>
        <div class="flex-box">
            <div class="box">C</div>
            <div class="box card" style="background-color: blueviolet;">D</div>
        </div>

        <div class="flex-box centered-box">
            <div class="flex-inner-box card">
                <div class="box color-aqua card">1</div>
                <div class="box color-aqua card">2</div>
                <div class="box color-aqua card">3</div>
                <div class="box color-aqua card">4</div>
            </div>
        </div>
    </div>
</body>

</html>
