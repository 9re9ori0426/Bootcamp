<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 2px solid black;
            border-radius: 4px;
            padding: 4px;
        }

        .container {
            display: flex;
            background-color: yellow;
            /* justify-content: space-between; */
            height: 200px;
            align-items: center;
        }

        .item {
            border-color: white;
            color: white;
            background-color: green;
            margin: 4px;

            &:nth-child(1) {
                width: 100px;
            }

            &:nth-child(2) {
                background-color: red;
                width: 300px;
                z-index: 3;
            }

            &:nth-child(3) {}

            label:hover {
                cursor: pointer;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="c1">
        <div class="item">helloflex</div>
        <div class="item">abc</div>
        <div class="item">helloflex</div>
    </div>
    <input type="radio" id="v1" name="test" value="Flex" onchange="">
    <label for="Flex">Flex</label>
    <input type="radio" id="v2" name="test" value="Block" onchange="">
    <label for="Block">Block</label>

    <script>
        const _container = document.getElementById("c1");
        document.getElementById("#v1").addEventListener("click", () => {
            _container.style.display = 'flex'
        })
        document.getElementById("#v2").addEventListener("click", () => {
            _container.style.display = 'block'
        })
    </script>

</html>
