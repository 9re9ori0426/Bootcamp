<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul,
        li {
            list-style: none;
            margin: 0;
            padding: 0;

        }

        ul.my-menu>li {
            background-color: antiquewhite;
            display: inline-block;
            width: 80px;
            text-align: center;
            padding: 5px 10px;
            /*상하 좌우*/
            position: relative;

            &:hover>span {
                font-weight: bold;
            }
        }

        ul.my-menu>li>ul.submenu {
            position: absolute;
            top: 100%;
            left: 0;
            display: none;
        }

        ul.my-menu>li:hover>ul.submenu {
            display: block;
        }

        ul.my-menu>li ul.submenu>li {
            background-color: violet;
            width: 80px;
            padding: 5px 10px;

            &:hover {
                background-color: black;
                color: white;
                cursor: pointer;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <ul class="my-menu">
            <li class="menu1"><span>메뉴1</span></li>
            <li class="menu2"><span>메뉴2</span>
                <ul class="menu2-sub submenu">
                    <li>메뉴2-1</li>
                    <li>메뉴2-2</li>
                    <li>메뉴2-3</li>
                    <li>메뉴2-4</li>
                </ul>
            </li>
            <li class="menu3"><span>메뉴3</span>
                <ul class="menu3-sub submenu">
                    <li>메뉴3-1</li>
                    <li>메뉴3-2</li>
                    <li>메뉴3-3</li>
                    <li>메뉴3-4</li>
                </ul>
            </li>
            <li class="menu4"><span>메뉴4</span></li>
        </ul>

    </div>
</body>

</html>
