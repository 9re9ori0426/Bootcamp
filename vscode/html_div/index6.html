<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 기본 초기화 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .menu {
            display: flex;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .menu-item {
            position: relative;
        }

        .menu-item>a {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
        }

        /* dropdown */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;

            width: 160px;
            margin: 0;
            padding: 0;

            list-style: none;
            background: white;
            border: 1px solid #ddd;

            /* 처음에는 숨김 */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                visibility 0.2s ease;
        }

        .dropdown-menu a {
            display: block;
            padding: 12px 15px;
            color: #333;
            text-decoration: none;
        }

        /* 마우스를 올리면 표시 */
        .dropdown:hover .dropdown-menu,
        .dropdown:focus-within .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* 서브 메뉴 hover */
        .dropdown-menu a:hover {
            background: #f5f5f5;
        }
    </style>
</head>

<body>
    <nav class="nav">
        <ul class="menu">
            <li class="menu-item">
                <a href="#">메뉴 1</a>
            </li>

            <li class="menu-item dropdown">
                <a href="#">메뉴 2</a>

                <ul class="dropdown-menu">
                    <li><a href="#">서브 메뉴 1</a></li>
                    <li><a href="#">서브 메뉴 2</a></li>
                    <li><a href="#">서브 메뉴 3</a></li>
                </ul>
            </li>

            <li class="menu-item">
                <a href="#">메뉴 3</a>
            </li>
        </ul>
    </nav>

</body>

</html>
