        <tr>

        </tr>
    </table>

    <table border="1" width="300px" height="300px">
        <tr>
            <td id="a" colspan="2"></td>
            <td id="b" rowspan="2"></td>
        </tr>
        <tr>
            <td id="c" rowspan="2"></td>
            <td id="d"></td>
        </tr>
        <tr>
            <td colspan="2"></td>
        </tr>
    </table>
    <button onclick="handleReverse()">asdf</button>

    <script>
        let isReverse = true;
        const handleReverse = () => {
            let a = document.getElementById("a");
            let b = document.getElementById("b");
            let c = document.getElementById("c");
            let d = document.getElementById("d");
            let e = document.getElementById("e");
            if(isReverse){
                a.setAttribute("colspan", 1);
                a.setAttribute("rowspan", 2);
                b.setAttribute("colspan", 2);
                b.setAttribute("rowspan", 1);
                c.setAttribute("colspan", 1);
                c.setAttribute("rowspan", 1);
                d.setAttribute("colspan", 1);
                d.setAttribute("rowspan", 2);
            }
            else{
                a.setAttribute("colspan", 2);
                a.setAttribute("rowspan", 1);
                b.setAttribute("colspan", 1);
                b.setAttribute("rowspan", 2);
                c.setAttribute("colspan", 1);
                c.setAttribute("rowspan", 2);
                d.setAttribute("colspan", 1);
                d.setAttribute("rowspan", 1);
            }
            isReverse = !isReverse;
        }
    </script>
</body>
